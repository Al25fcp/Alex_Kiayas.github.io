<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>
    <style>
        body { background-color: #f4f4f9; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; font-family: sans-serif; }
        .page { box-shadow: 0 4px 8px rgba(0,0,0,0.15); margin-bottom: 20px; max-width: 800px; width: 100%; height: auto; display: block; }
        .btn { background: #24292e; color: white; padding: 10px 20px; text-decoration: none; border-radius: 5px; margin-bottom: 20px; font-weight: bold; }
        .btn:hover { background: #444; }
    </style>
</head>
<body>
    <!-- Allows recruiters to still download the actual PDF if they want to print it -->
    <a href="portfolio.pdf" class="btn" download>📥 Download Original PDF</a>

    <!-- Add a line for every page you converted -->
    <img src="page1.jpg" alt="Portfolio Page 1" class="page">
    <img src="page2.jpg" alt="Portfolio Page 2" class="page">
</body>
</html>
